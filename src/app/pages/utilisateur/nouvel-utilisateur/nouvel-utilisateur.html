<section class="page-content form-page">
  <header class="page-heading">
    <div>
      <p class="eyebrow">ESPACE DE TRAVAIL</p>
      <h1>Nouvel utilisateur</h1>
      <p class="page-description">Ajoutez un membre à votre équipe.</p>
    </div>
  </header>

  <form class="form-card" (ngSubmit)="enregistrerUtilisateur()">
    <div class="form-section-heading"><span class="form-icon"><i class="bi bi-person-plus"></i></span><div><h2>Informations du compte</h2><p>Le mot de passe doit comporter au moins 8 caractères.</p></div></div>
    <div class="form-grid">
      <label class="form-field"><span>Nom <b>*</b></span><input class="form-control" name="nom" [(ngModel)]="utilisateurDto.nom" autocomplete="family-name" required></label>
      <label class="form-field"><span>Prénom <b>*</b></span><input class="form-control" name="prenom" [(ngModel)]="utilisateurDto.prenom" autocomplete="given-name" required></label>
      <label class="form-field"><span>Adresse e-mail <b>*</b></span><input class="form-control" type="email" name="email" [(ngModel)]="utilisateurDto.email" autocomplete="email" required></label>
      <label class="form-field"><span>Mot de passe provisoire <b>*</b></span><input class="form-control" type="password" name="password" [(ngModel)]="utilisateurDto.motDePasse" autocomplete="new-password" minlength="8" required></label>
      <label class="form-field"><span>Date de naissance</span><input class="form-control" type="date" name="dateNaissance" [(ngModel)]="utilisateurDto.dateNaissance"></label>
      <label class="form-field"><span>Adresse</span><input class="form-control" name="adresse1" [(ngModel)]="adresse.adresse1" autocomplete="address-line1"></label>
      <label class="form-field"><span>Ville</span><input class="form-control" name="ville" [(ngModel)]="adresse.ville" autocomplete="address-level2"></label>
      <label class="form-field"><span>Pays</span><input class="form-control" name="pays" [(ngModel)]="adresse.pays" autocomplete="country-name"></label>
    </div>
    <div class="inline-alert" role="alert" *ngIf="errorMessage"><i class="bi bi-exclamation-circle"></i> {{ errorMessage }}</div>
    <div class="form-actions">
      <button class="btn btn-outline-secondary" type="button" (click)="cancel()">Annuler</button>
      <button class="btn btn-primary" type="submit" [disabled]="isSaving"><span *ngIf="isSaving" class="spinner-border spinner-border-sm me-2"></span>{{ isSaving ? 'Enregistrement...' : 'Créer l’utilisateur' }}</button>
    </div>
  </form>
</section>
