<div class="row m-3">
  <div class="card col-md-5 text-center">
    <div class="col ms-3">
      <div class="mb-3 mt-3">
        <i class="bi bi-person-circle" style="font-size: 2rem;"></i>
      </div>
      <div class="mb-3">
        <h2>Nom Prenom</h2>
        <small class="form-text text-muted">Adresse, Ville, Code Postal</small>
      </div>
    </div>
  </div>
  <div class="card col-md-7">
    <form class="mt-3">
      <div class="form-group mb-3">
        <input type="password" class="form-control"
          placeholder="Ancien mot de passe">
      </div>
      <div class="form-group mb-3">
        <input type="password" class="form-control"
          placeholder="Nouveau mot de passe">
      </div>
      <div class="form-group mb-3">
        <input type="password" class="form-control"
          placeholder="Confirmer le mot de passe">
      </div>
    </form>
  </div>
</div>
<div class="row m-3">
  <div class="col-md-12 text-end">
    <button class="btn btn-danger ms-2" (click)="cancel()">
      <i class="bi bi-x-circle"></i>&nbsp; Annuler
    </button>
    <button class="btn btn-primary ms-2">
      <i class="bi bi-download"></i>&nbsp; Enregistrer
    </button>
  </div>
</div>
