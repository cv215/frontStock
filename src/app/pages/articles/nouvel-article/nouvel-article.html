<section class="page-content form-page">
  <header class="page-heading">
    <div>
      <p class="eyebrow">CATALOGUE</p>
      <h1>Nouvel article</h1>
      <p class="page-description">Ajoutez un produit et définissez son prix de vente.</p>
    </div>
  </header>

  <form class="form-card" (ngSubmit)="enregistrerArticle()">
    <div class="form-section-heading"><span class="form-icon"><i class="bi bi-box-seam"></i></span><div><h2>Informations de l’article</h2><p>Le prix TTC est calculé à partir du prix HT et de la TVA.</p></div></div>
    <div class="form-grid">
      <label class="form-field"><span>Code article <b>*</b></span><input class="form-control" name="codeArticle" [(ngModel)]="articleDto.codeArticle" autocomplete="off" required></label>
      <label class="form-field"><span>Désignation <b>*</b></span><input class="form-control" name="designation" [(ngModel)]="articleDto.designation" required></label>
      <label class="form-field"><span>Prix unitaire HT (XAF) <b>*</b></span><input class="form-control" type="number" name="prixHt" min="0" step="0.01" [(ngModel)]="articleDto.prixUnitaireHt" (ngModelChange)="updatePrixTtc()" required></label>
      <label class="form-field"><span>TVA (%) <b>*</b></span><input class="form-control" type="number" name="tva" min="0" max="100" step="0.01" [(ngModel)]="articleDto.tauxTva" (ngModelChange)="updatePrixTtc()" required></label>
      <label class="form-field"><span>Prix unitaire TTC (XAF)</span><input class="form-control" type="number" name="prixTtc" [ngModel]="articleDto.prixUnitaireTtc" readonly></label>
      <label class="form-field"><span>Catégorie <b>*</b></span><select class="form-select" name="category" [(ngModel)]="categoryId" required [disabled]="isLoadingCategories"><option [ngValue]="null" disabled>{{ isLoadingCategories ? 'Chargement...' : 'Sélectionner une catégorie' }}</option><option *ngFor="let category of categories" [ngValue]="category.id">{{ category.designation }}</option></select></label>
      <label class="form-field photo-field"><span>Photo (facultatif)</span>
        <span class="photo-picker">
          <span class="photo-preview"><img *ngIf="photoPreview" [src]="photoPreview" alt="Aperçu de la photo"><i *ngIf="!photoPreview" class="bi bi-image"></i></span>
          <input class="form-control" type="file" name="photo" [accept]="photoTypes" (change)="choisirPhoto($event)">
        </span>
        <small class="text-muted">JPEG, PNG, WebP ou GIF, 5 Mo maximum.</small>
      </label>
    </div>
    <div class="inline-alert" role="alert" *ngIf="errorMessage"><i class="bi bi-exclamation-circle"></i> {{ errorMessage }}</div>
    <div class="form-actions">
      <button class="btn btn-outline-secondary" type="button" (click)="cancel()">Annuler</button>
      <button class="btn btn-primary" type="submit" [disabled]="isSaving || isLoadingCategories"><span *ngIf="isSaving" class="spinner-border spinner-border-sm me-2"></span>{{ isSaving ? 'Enregistrement...' : 'Enregistrer l’article' }}</button>
    </div>
  </form>
</section>
