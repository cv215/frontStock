<div class="col mb-3">
  <!--image du nouvel article-->
  <div class="col-md-12 mb-3 mt-3">
    <img src="assets/pomme-de-terre-spunta-full-12961981.jpg" class="rounded-circle" width="200px" height="200px">
  </div>
  <hr>
  <!--le formulaire complet du nouvel article-->
  <div class="col-md-12">
    <div class="col-md-12 mb-3 ms-3">
      <h2>
        <i class="bi bi-info-circle-fill blow-color"></i>&nbsp; Information de l'article
      </h2>
    </div>
    <div class="col-md-12">
      <form>
        <div class="row mb-3">
          <div class="col">
            <input type="text" class="form-control" placeholder="Code article"
              aria-label="First name">
          </div>
          <div class="col">
            <input type="text" class="form-control" placeholder="Designation"
              aria-label="Last name">
          </div>
        </div>

        <div class="row mb-3">
          <div class="col">
            <input type="text" class="form-control"
              placeholder="Prix unitaire HT"
              aria-label="First name">
          </div>
          <div class="col">
            <input type="text" class="form-control" placeholder="Taux TVA"
              aria-label="Last name">
          </div>
        </div>

        <div class="row mb-3">
          <div class="col">
            <input type="text" class="form-control"
              placeholder="Prix unitaire TTC"
              aria-label="First name">
          </div>
          <div class="col">
            <select class="form-select" aria-label="Default select example">
              <option selected>Selectionner une categorie</option>
              <option value="1">One</option>
              <option value="2">Two</option>
              <option value="3">Three</option>
            </select>
          </div>
        </div>
      </form>
    </div>
  </div>
  <!--boutton de validation-->
  <div class="col-md-12 text-end">
    <button class="btn btn-danger ms-2" (click)="cancel()">
      <i class="bi bi-x-circle"></i>&nbsp; Annuler
    </button>
    <button class="btn btn-primary ms-2">
      <i class="bi bi-download"></i>&nbsp; Enregistrer
    </button>
  </div>
</div>
