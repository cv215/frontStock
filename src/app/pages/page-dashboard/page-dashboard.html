<div class="dashboard-shell" [class.client-shell]="isClient">
  <aside class="dashboard-sidebar">
    <a class="sidebar-brand" [routerLink]="['/dashboard/ensemble']">
      <span class="brand-mark"><i class="bi" [class.bi-box-seam]="!isClient" [class.bi-bar-chart-fill]="isClient"></i></span>
      <span><strong>{{ isClient ? 'Stockly' : 'StockFlow' }}</strong><small *ngIf="!isClient">Gestion de stock</small></span>
    </a>
    <div class="client-space-card" *ngIf="isClient">
      <span>ESPACE CLIENT</span>
      <strong>{{ connectedUserName }}</strong>
    </div>
    <app-menu></app-menu>
    <div class="sidebar-footer">
      <ng-container *ngIf="!isClient; else clientSidebarAccount">
        <span class="online-indicator"></span>
        <span>Votre espace est prêt</span>
      </ng-container>
      <ng-template #clientSidebarAccount>
        <span class="client-sidebar-avatar">{{ userInitials }}</span>
        <span class="client-sidebar-user"><strong>{{ connectedUserName }}</strong><small>Compte client</small></span>
        <app-deconnexion></app-deconnexion>
      </ng-template>
    </div>
  </aside>

  <div class="dashboard-main">
    <header class="dashboard-topbar"><app-header></app-header></header>
    <main class="dashboard-content"><router-outlet></router-outlet></main>
    <footer class="dashboard-footer"><span>StockFlow · Gestion simplifiée</span><span>© {{ currentYear }}</span></footer>
  </div>
</div>
