<div class="col">
  <div class="row m-3">
    <div class="col-md-8 p-0">
      <h1>Mouvement du stock</h1>
    </div>
    <div class="col-md-4 text-right">
      <app-boutton-action
      [isImporterVisible]="false"
      [isNouveauVisible]="false">
    </app-boutton-action>
    </div>
  </div>
  <div class="col m-3">
    <div class="accordion accordion-flush" id="accordionFlushExample">
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" type="button"
            data-bs-toggle="collapse" data-bs-target="#flush-collapseOne"
            aria-expanded="false" aria-controls="flush-collapseOne">
            <app-detail-mvt-stk></app-detail-mvt-stk>
          </button>
        </h2>
        <div id="flush-collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample" style="max-height: 300px; overflow-y: scroll">
          <div class="accordion-body">
            <app-detail-mvt-stk-article></app-detail-mvt-stk-article>
            <app-detail-mvt-stk-article></app-detail-mvt-stk-article>
            <app-detail-mvt-stk-article></app-detail-mvt-stk-article>
            <app-detail-mvt-stk-article></app-detail-mvt-stk-article>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="row mb-3">
    <div class="col-md-12 text-center">
      <app-pagination></app-pagination>
    </div>
  </div>
</div>
