<div class="d-flex">
  <div class="md-4 flex-fill"  *ngIf="isImporterVisible">
    <button type="button" class="btn btn-warning">
      <i class="bi bi-cloud-arrow-up-fill"></i>
      Importer
    </button>
  </div>
  <div class="md-4 flex-fill" *ngIf="isExporterVisible">
    <button type="button" class="btn btn-success">
      <i class="bi bi-cloud-arrow-down-fill"></i>
      Exporter
    </button>
  </div>
  <div class="md-4 flex-fill" *ngIf="isNouveauVisible">
    <button type="button" class="btn btn-primary" (click)="bouttonNouveauClick()">
      <i class="bi bi-plus"></i>
      Nouveau
    </button>
  </div>
</div>
