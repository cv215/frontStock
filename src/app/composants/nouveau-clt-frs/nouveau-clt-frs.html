<section class="page-content form-page">
  <header class="page-heading">
    <div>
      <p class="eyebrow">NOUVEAU CONTACT</p>
      <h1>Ajouter un {{ origin }}</h1>
      <p class="page-description">Renseignez les coordonnées de votre {{ origin }}.</p>
    </div>
  </header>

  <form class="form-card" (ngSubmit)="saveClick()">
    <div class="form-section-heading"><span class="form-icon"><i class="bi" [class.bi-people]="origin === 'client'" [class.bi-truck]="origin === 'fournisseur'"></i></span><div><h2>Informations de contact</h2><p>Les champs marqués d’un astérisque sont obligatoires.</p></div></div>
    <div class="form-grid">
      <label class="form-field"><span>Nom <b>*</b></span><input class="form-control" name="nom" [(ngModel)]="nom" autocomplete="family-name" required></label>
      <label class="form-field"><span>Prénom <b>*</b></span><input class="form-control" name="prenom" [(ngModel)]="prenom" autocomplete="given-name" required></label>
      <label class="form-field"><span>Adresse e-mail <b>*</b></span><input class="form-control" type="email" name="email" [(ngModel)]="email" autocomplete="email" required></label>
      <label class="form-field"><span>Téléphone <b>*</b></span><input class="form-control" type="tel" name="telephone" [(ngModel)]="telephone" autocomplete="tel" required></label>
      <label class="form-field"><span>Adresse <b>*</b></span><input class="form-control" name="adresse1" [(ngModel)]="adresse.adresse1" autocomplete="address-line1" required></label>
      <label class="form-field"><span>Complément d’adresse</span><input class="form-control" name="adresse2" [(ngModel)]="adresse.adresse2" autocomplete="address-line2"></label>
      <label class="form-field"><span>Ville <b>*</b></span><input class="form-control" name="ville" [(ngModel)]="adresse.ville" autocomplete="address-level2" required></label>
      <label class="form-field"><span>Code postal</span><input class="form-control" name="codePostale" [(ngModel)]="adresse.codePostale" autocomplete="postal-code"></label>
      <label class="form-field"><span>Pays <b>*</b></span><input class="form-control" name="pays" [(ngModel)]="adresse.pays" autocomplete="country-name" required></label>
    </div>
    <div class="inline-alert" role="alert" *ngIf="errorMessage"><i class="bi bi-exclamation-circle"></i> {{ errorMessage }}</div>
    <div class="form-actions">
      <button class="btn btn-outline-secondary" type="button" (click)="cancelClick()">Annuler</button>
      <button class="btn btn-primary" type="submit" [disabled]="isSaving"><span *ngIf="isSaving" class="spinner-border spinner-border-sm me-2"></span>{{ isSaving ? 'Enregistrement...' : 'Enregistrer' }}</button>
    </div>
  </form>
</section>
