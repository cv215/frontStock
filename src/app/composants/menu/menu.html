<nav class="side-navigation" aria-label="Navigation principale">
  <section class="nav-group" *ngFor="let menu of menuProperties">
    <button class="nav-group-toggle" type="button" (click)="toggleMenu(menu)"
      [attr.aria-expanded]="isExpanded(menu)"
      [attr.aria-controls]="'menu-items-' + menu.id">
      <span class="nav-group-title"><i [class]="menu.icon" aria-hidden="true"></i>{{ menu.titre }}</span>
      <i class="bi bi-chevron-down nav-chevron" [class.rotated]="isExpanded(menu)" aria-hidden="true"></i>
    </button>
    <div class="nav-group-items" [id]="'menu-items-' + menu.id" *ngIf="isExpanded(menu)">
      <a class="nav-link" *ngFor="let sousMenu of menu.sousMenu"
        [routerLink]="['/dashboard', sousMenu.url]"
        [queryParams]="sousMenu.queryParams"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="expandMenu(menu)">
        <i [class]="sousMenu.icon" aria-hidden="true"></i>
        <span>{{ sousMenu.titre }}</span>
      </a>
    </div>
  </section>
</nav>
