<div class="row mb-1 mr-0 custom-border">

  </div>

  <!-- detail article -->
  <div class="col-md-4 border-right border-start border-2 ms-3">
    <div class="col">
      <div class="row">
        <div class="col-md-1"><i class="bi bi-info-circle-fill blow-color"></i></div>
        <div class="col-md-11">Code article</div>
      </div>
      <div class="row">
        <div class="col-md-1"><i class="bi bi-info-circle-fill blow-color"></i></div>
        <div class="col-md-11">Designation</div>
      </div>
      <div class="row">
        <div class="col-md-1"><i class="bi bi-currency-dollar blow-color"></i></div>
        <div class="col-md-11">Prix HT</div>
      </div>
      <div class="row">
        <div class="col-md-1"><i class="bi bi-currency-dollar blow-color"></i></div>
        <div class="col-md-11">Prix TTC</div>
      </div>
    </div>
  </div>

   <!-- detail categorie -->
  <div class="col-md-4 border-start border-2 ps-3 text-center">
    <div class="row">
      <div class="col-md-10">
        <div class="row">
          <div class="col-md-12">
            <h3>
              Stock actuele
            </h3>
          </div>
          <div class="col-md-12">
            <h3>
              Quantite
            </h3>
          </div>
        </div>
      </div>
    </div>
  </div>

   <!-- bouton action -->
  <div class="col-md-2 border-right border-start border-2 ps-3 text-center">
    <div class="row">
      <div>
        <button type="button" class="btn btn-link souligne" data-bs-toggle="modal" data-bs-target="#exampleModal" >
           <i class="bi bi-box2-fill"></i>
           Correction de stock
        </button>
      </div>
    </div>
  </div>

 <!-- model action -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Correction de stock</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <input type="text" class="form-control" placeholder="Quantité">
          </div>
          <div class="mb-3">
            <select class="form-control">
              <option value="">Correction positive</option>
              <option value="">Correction negative</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal"><i class="bi bi-trash3"></i>&nbsp;Annuler</button>
        <button type="button" class="btn btn-primary"><i class="bi bi-save"></i>&nbsp;Enregistrer</button>
      </div>
    </div>
  </div>
</div>
